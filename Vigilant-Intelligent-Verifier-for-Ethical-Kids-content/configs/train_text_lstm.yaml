# Configuration for Text LSTM Model Training

model:
  type: "TextLSTM"
  vocab_size: 10000
  embedding_dim: 128
  hidden_dim: 256
  num_layers: 2
  num_classes: 2
  dropout: 0.3

data:
  captions_path: "data/captions.csv"
  labels_path: "data/labels.csv"
  batch_size: 32
  max_length: 128
  num_workers: 4
  train_split: 0.8
  val_split: 0.2
  random_state: 42

training:
  num_epochs: 50
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 1e-5
  gradient_clip: 1.0
  scheduler: "step"
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  save_interval: 10

checkpoint:
  checkpoint_dir: "checkpoints/text_lstm"
  save_best: true

device: "cuda"
seed: 42

