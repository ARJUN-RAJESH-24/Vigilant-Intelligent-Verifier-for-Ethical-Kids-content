# Configuration for Audio CNN Model Training

model:
  type: "AudioCNN"
  num_classes: 2
  dropout: 0.3

data:
  video_dir: "data/videos"
  labels_path: "data/labels.csv"
  batch_size: 32
  sample_rate: 22050
  duration: 30
  n_mels: 128
  num_workers: 4
  train_split: 0.8
  val_split: 0.2
  random_state: 42

training:
  num_epochs: 50
  learning_rate: 0.001
  optimizer: "adam"
  weight_decay: 1e-5
  gradient_clip: 1.0
  scheduler: "step"
  scheduler_step_size: 10
  scheduler_gamma: 0.1
  save_interval: 10

checkpoint:
  checkpoint_dir: "checkpoints/audio_cnn"
  save_best: true

device: "cuda"
seed: 42

